name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkgconf json-c libyaml ncurses openssl
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libjson-c-dev libyaml-dev libncurses-dev libssl-dev
      - name: Test
        run: make -j2 test
      - name: Address and undefined behavior sanitizers
        env:
          ASAN_OPTIONS: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' && 'detect_leaks=0' || '' }}
        run: make -j2 sanitize
      - name: ARM64 Linux leak checks
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: sh scripts/check-leaks.sh "$PWD/build-sanitize/kitmux"
